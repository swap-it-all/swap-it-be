spring:
  application:
    name: swapit

  profiles:
    active:
      - prd   # 로컬에서는 dev로 변경해서 사용.

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile