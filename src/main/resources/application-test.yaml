spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/test_db
    username: root
    password: root

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create-drop
      format_sql: true
      dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  data:
    redis:
      host: test-redis-host

cloud:
  aws:
    s3:
      bucket: test-bucket
    stack:
      auto: false